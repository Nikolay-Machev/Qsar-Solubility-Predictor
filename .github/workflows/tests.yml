name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "rdkit>=2024.3" "scikit-learn>=1.4,<2"
      - run: python -m unittest -v
